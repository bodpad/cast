name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: dist/src is committed and up to date
        run: git diff --exit-code -- dist/src || (echo "::error::Run npm run build and commit dist/src" && exit 1)
      - name: Chrome
        run: google-chrome --version
      - run: node --test --test-concurrency=1 dist/test/
      - name: Plugin manifests
        run: npx -y @anthropic-ai/claude-code plugin validate --strict .
