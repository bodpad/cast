version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Types match the oldest supported Node (engines: >=20).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      playwright:
        patterns: ["@playwright/*", "playwright*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
